<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธนาคารปูม้า - Crab Bank System</title>
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js for Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        /* Loader Spinner */
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 4px solid #fff; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-hidden">

    <!-- 1. Login Screen -->
    <div id="login-container" class="max-w-md mx-auto bg-gradient-to-br from-blue-700 to-blue-900 h-[100dvh] relative flex flex-col justify-center items-center p-6 z-[100]">
        <div class="text-center mb-8">
            <div class="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm border border-white/20 shadow-xl">
                <i class="fa-solid fa-crab text-5xl text-orange-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide mb-1">ธนาคารปูม้า</h1>
            <p class="text-xs text-blue-200">ESG & SROI Management System</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="w-full bg-white rounded-2xl p-6 shadow-2xl">
            <h2 class="text-gray-800 font-bold mb-4 text-center">เข้าสู่ระบบ</h2>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="login-user" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-10 pr-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-medium text-gray-500 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                    <input type="password" id="login-pass" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-10 pr-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700 transition-colors">
                เข้าสู่ระบบ
            </button>
            <div class="mt-4 text-center text-[10px] text-gray-400">
                Admin: Admin/1234 | User: user/4321
            </div>
        </form>
    </div>

    <!-- 2. Main App Container (Hidden by default) -->
    <div id="app-container" class="hidden max-w-md mx-auto bg-gray-50 h-[100dvh] relative shadow-2xl flex-col overflow-hidden border-x border-gray-200">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white p-4 flex justify-between items-center shadow-md shrink-0 z-20">
            <div>
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-crab text-orange-300 mr-2"></i>ธนาคารปูม้า</h1>
                <p class="text-[10px] text-blue-100 opacity-90">ผู้ใช้งาน: <span id="lbl-current-user" class="font-bold"></span></p>
            </div>
            <!-- Sync/Refresh Button -->
            <button onclick="refreshData()" class="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white transition-colors shadow-sm" title="รีเฟรชข้อมูลจากระบบ">
                <i class="fa-solid fa-rotate" id="sync-icon"></i>
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto w-full relative z-10 pb-24" id="main-content">
            <!-- Views dynamically injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-between px-1 py-2 pb-safe shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-50">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-blue-600 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-chart-pie text-[18px] mb-1"></i><span class="text-[9px] font-medium">ภาพรวม</span>
            </button>
            <button onclick="switchTab('deposit')" id="nav-deposit" class="flex flex-col items-center text-gray-400 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-box-archive text-[18px] mb-1"></i><span class="text-[9px] font-medium">รับฝาก</span>
            </button>
            <button onclick="switchTab('release')" id="nav-release" class="flex flex-col items-center text-gray-400 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-water text-[18px] mb-1"></i><span class="text-[9px] font-medium">ปล่อยปู</span>
            </button>
            <button onclick="switchTab('purchase')" id="nav-purchase" class="flex flex-col items-center text-gray-400 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-hand-holding-dollar text-[18px] mb-1"></i><span class="text-[9px] font-medium">รับซื้อ</span>
            </button>
            <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center text-gray-400 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-users text-[18px] mb-1"></i><span class="text-[9px] font-medium">สมาชิก</span>
            </button>
        </nav>

        <!-- Add Member Modal -->
        <div id="modal-add-member" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
            <div class="modal-overlay absolute inset-0" onclick="closeModal('modal-add-member')"></div>
            <div class="bg-white rounded-2xl w-full max-w-sm relative z-10 shadow-xl overflow-hidden animate-[slideUp_0.3s_ease-out]">
                <div class="bg-blue-600 px-4 py-3 flex justify-between items-center text-white">
                    <h3 class="font-bold">เพิ่มสมาชิกระบบธนาคารปู</h3>
                    <button onclick="closeModal('modal-add-member')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleAddMember(event)" class="p-5">
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">ชื่อ-สกุล</label>
                        <input type="text" id="new-member-name" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">เบอร์โทรศัพท์</label>
                        <input type="tel" id="new-member-phone" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="mb-6">
                        <label class="block text-xs font-medium text-gray-500 mb-1">พื้นที่</label>
                        <select id="new-member-area" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="สะพลี">สะพลี</option>
                            <option value="ปากน้ำปราณ">ปากน้ำปราณ</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-md">
                        บันทึกสมาชิกใหม่
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-[200] hidden flex-col items-center justify-center backdrop-blur-sm">
        <div class="spinner mb-4"></div>
        <div id="loading-text" class="text-white font-medium text-sm">กำลังเชื่อมต่อข้อมูล...</div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-[300]">
        Notification
    </div>

    <script>
        // ==========================================
        // 1. STATE & AUTHENTICATION
        // ==========================================
        let currentUser = null;
        let currentRole = null; // 'admin' or 'user'
        const MAX_MEMBERS = 300;
        
        let db = { members: [], deposits: [], releases: [], purchases: [] };
        let currentSelectedYear = 2026;
        let currentChartMode = 'monthly'; 
        let barChartInstance, donutChartInstance, purchaseDonutChartInstance = null;

        function showLoading(text = 'กำลังโหลด...') {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('loading-overlay').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('loading-overlay').classList.remove('flex');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        // ระบบ Login
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if (user === 'Admin' && pass === '1234') {
                currentUser = 'Admin'; currentRole = 'admin';
            } else if (user === 'user' && pass === '4321') {
                currentUser = 'User (Staff)'; currentRole = 'user';
            } else {
                showToast('❌ Username หรือ Password ไม่ถูกต้อง');
                return;
            }

            // เข้าสู่ระบบสำเร็จ
            document.getElementById('lbl-current-user').innerText = currentUser;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            
            // โหลดข้อมูลจาก Google Sheets
            refreshData();
        }

        // ==========================================
        // 2. GOOGLE APPS SCRIPT INTEGRATION
        // ==========================================
        function refreshData() {
            if (typeof google === 'undefined') {
                // หากรันนอก GAS (ใช้ข้อมูลจำลองชั่วคราวเพื่อเทส UI)
                showToast('กำลังใช้งานแบบ Offline Mode (Mock Data)');
                db = getMockData();
                switchTab('dashboard');
                return;
            }

            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            showLoading('กำลังซิงค์ข้อมูลล่าสุด...');

            google.script.run
                .withSuccessHandler(function(response) {
                    hideLoading();
                    icon.classList.remove('fa-spin');
                    const res = JSON.parse(response);
                    if(res.status === 'success') {
                        db = res.data;
                        showToast('อัปเดตข้อมูลสำเร็จ');
                        switchTab(currentTab || 'dashboard');
                    } else {
                        showToast('❌ ข้อผิดพลาด: ' + res.message);
                    }
                })
                .withFailureHandler(function(error) {
                    hideLoading();
                    icon.classList.remove('fa-spin');
                    showToast('❌ การเชื่อมต่อล้มเหลว');
                })
                .getAllData();
        }

        function pushDataToSheet(sheetName, rowArray, actionDetail, successMsg, callback) {
            if (typeof google === 'undefined') {
                showToast('Offline Mode: จำลองการบันทึกสำเร็จ');
                if(callback) callback();
                return;
            }

            showLoading('กำลังบันทึกข้อมูล...');
            google.script.run
                .withSuccessHandler(function(response) {
                    hideLoading();
                    const res = JSON.parse(response);
                    if(res.status === 'success') {
                        showToast('✅ ' + successMsg);
                        // ดึงข้อมูลใหม่หลังจากบันทึกเสร็จ เพื่อให้ UI อัปเดตทันที
                        refreshData(); 
                        if(callback) callback();
                    } else {
                        showToast('❌ เกิดข้อผิดพลาด: ' + res.message);
                    }
                })
                .withFailureHandler(function(error) {
                    hideLoading();
                    showToast('❌ เชื่อมต่อล้มเหลว ลองใหม่อีกครั้ง');
                })
                .addRecord(sheetName, rowArray, currentUser, actionDetail);
        }

        // ==========================================
        // 3. UI RENDERING & NAVIGATION
        // ==========================================
        const mainContent = document.getElementById('main-content');
        let currentTab = 'dashboard';

        function switchTab(tabId) {
            currentTab = tabId;
            ['dashboard', 'deposit', 'release', 'purchase', 'members'].forEach(id => {
                const el = document.getElementById(`nav-${id}`);
                if (id === tabId) {
                    el.classList.replace('text-gray-400', 'text-blue-600');
                    el.classList.add('bg-blue-50');
                } else {
                    el.classList.replace('text-blue-600', 'text-gray-400');
                    el.classList.remove('bg-blue-50');
                }
            });

            if (barChartInstance) { barChartInstance.destroy(); barChartInstance = null; }
            if (donutChartInstance) { donutChartInstance.destroy(); donutChartInstance = null; }
            if (purchaseDonutChartInstance) { purchaseDonutChartInstance.destroy(); purchaseDonutChartInstance = null; }

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'deposit') renderDeposit();
            if (tabId === 'release') renderRelease();
            if (tabId === 'purchase') renderPurchase();
            if (tabId === 'members') renderMembers();
        }

        // --- โค้ด Dashboard, Deposit, Release, Purchase จะเหมือนเดิม โดยปรับแก้การเรียก submit ---
        
        function renderDashboard() {
            // คำนวณปีจากข้อมูลที่มี
            const yearsSet = new Set(db.deposits.map(d => {
                let dt = new Date(d.date); return isNaN(dt)? 2026 : dt.getFullYear();
            }));
            yearsSet.add(new Date().getFullYear());
            yearsSet.add(2026);
            
            const sortedYears = Array.from(yearsSet).filter(y => y >= 2026).sort((a, b) => a - b);
            if(!sortedYears.includes(currentSelectedYear)) currentSelectedYear = sortedYears[0] || 2026;
            
            const yearOptions = sortedYears.map(y => `<option value="${y}" ${y === currentSelectedYear ? 'selected' : ''}>ปี ${y + 543}</option>`).join('');

            mainContent.innerHTML = `
                <div class="p-4 space-y-4 pb-10">
                    <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                        <div>
                            <h2 class="text-sm font-bold text-gray-800">ภาพรวมธนาคารปูม้า</h2>
                        </div>
                        <select id="dash-year-filter" onchange="updateDashboardData()" class="bg-gray-50 border border-gray-300 text-gray-700 text-xs rounded-lg px-3 py-2 font-medium focus:ring-blue-500 outline-none">
                            ${yearOptions}
                        </select>
                    </div>

                    <!-- KPI Banner -->
                    <div class="bg-gradient-to-br from-blue-700 to-blue-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-10 transform translate-x-4 -translate-y-4"><i class="fa-solid fa-water text-8xl"></i></div>
                        <h2 class="text-xs font-medium mb-1 opacity-90">ยอดปล่อยลูกปูระยะ Zoea (<span id="lbl-year-zoea">${currentSelectedYear + 543}</span>)</h2>
                        <div class="text-3xl font-black mb-3" id="kpi-zoea">0 <span class="text-base font-normal">ตัว</span></div>
                        <div>
                            <div class="flex justify-between text-[10px] mb-1"><span>เป้าหมาย: 10M ตัว</span><span id="kpi-progress-pct">0%</span></div>
                            <div class="w-full bg-blue-900/50 rounded-full h-2"><div id="kpi-progress-bar" class="bg-orange-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div></div>
                        </div>
                    </div>

                    <!-- Bar Chart -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-xs font-bold text-gray-800 flex items-center"><i class="fa-solid fa-chart-simple text-blue-500 mr-2"></i>สถิติรับฝากแม่ปู</h3>
                            <div class="flex bg-gray-100 p-0.5 rounded-lg text-[10px]">
                                <button onclick="setChartMode('daily')" id="mode-daily" class="px-2 py-1 rounded-md text-gray-500">รายวัน</button>
                                <button onclick="setChartMode('monthly')" id="mode-monthly" class="px-2 py-1 rounded-md bg-white text-blue-600 shadow-sm">รายเดือน</button>
                                <button onclick="setChartMode('yearly')" id="mode-yearly" class="px-2 py-1 rounded-md text-gray-500">รายปี</button>
                            </div>
                        </div>
                        <div class="h-48 w-full relative"><canvas id="monthlyChart"></canvas></div>
                    </div>

                    <!-- Donut Egg Color -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <h3 class="text-xs font-bold text-gray-800 mb-3"><i class="fa-solid fa-circle-notch text-orange-500 mr-2"></i>สัดส่วนสถานะไข่ปู</h3>
                        <div class="h-44 w-full relative flex justify-center"><canvas id="eggColorChart"></canvas></div>
                    </div>

                    <!-- Donut Purchase -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <h3 class="text-xs font-bold text-gray-800 mb-3"><i class="fa-solid fa-hand-holding-dollar text-indigo-500 mr-2"></i>การรับซื้อปูม้า (กก.)</h3>
                        <div class="h-44 w-full relative flex justify-center mb-4"><canvas id="purchaseDonutChart"></canvas></div>
                        <div class="grid grid-cols-2 gap-3 border-t border-gray-100 pt-4 text-center">
                            <div class="bg-indigo-50/60 rounded-xl p-3">
                                <div class="text-[10px] text-indigo-600">ยอดเงินรับซื้อ (เดือน)</div>
                                <div class="text-lg font-black text-indigo-700" id="kpi-pur-month">฿0</div>
                            </div>
                            <div class="bg-purple-50/60 rounded-xl p-3">
                                <div class="text-[10px] text-purple-600">ยอดเงินรับซื้อ (ทั้งปี)</div>
                                <div class="text-lg font-black text-purple-700" id="kpi-pur-year">฿0</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { initCharts(); updateDashboardData(); }, 100);
        }

        function initCharts() {
            const ctxBar = document.getElementById('monthlyChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, { type: 'bar', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });

            const ctxDonut = document.getElementById('eggColorChart').getContext('2d');
            donutChartInstance = new Chart(ctxDonut, { type: 'doughnut', data: { labels: ['เหลือง', 'ส้ม', 'ดำ'], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, cutout: '65%' } });

            const ctxPur = document.getElementById('purchaseDonutChart').getContext('2d');
            purchaseDonutChartInstance = new Chart(ctxPur, { type: 'doughnut', data: { labels: ['ไซส์ M', 'ไซส์ L'], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, cutout: '65%' } });
        }

        function setChartMode(mode) {
            currentChartMode = mode;
            ['daily', 'monthly', 'yearly'].forEach(m => {
                document.getElementById(`mode-${m}`).className = m === mode ? 'px-2 py-1 rounded-md font-medium bg-white text-blue-600 shadow-sm' : 'px-2 py-1 rounded-md font-medium text-gray-500';
            });
            updateDashboardData();
        }

        function updateDashboardData() {
            if(document.getElementById('dash-year-filter')) currentSelectedYear = parseInt(document.getElementById('dash-year-filter').value);
            document.getElementById('lbl-year-zoea').innerText = currentSelectedYear + 543;

            const yearlyReleases = db.releases.filter(r => new Date(r.date).getFullYear() === currentSelectedYear);
            const totalZoea = yearlyReleases.reduce((s, r) => s + (parseInt(r.zoeaReleased)||0), 0);
            const progressPct = Math.min((totalZoea / 10000000) * 100, 100);
            
            document.getElementById('kpi-zoea').innerHTML = `${totalZoea.toLocaleString()} <span class="text-base font-normal">ตัว</span>`;
            document.getElementById('kpi-progress-pct').innerText = `${progressPct.toFixed(1)}%`;
            document.getElementById('kpi-progress-bar').style.width = `${progressPct}%`;

            // Bar Chart Update
            const yearlyDeposits = db.deposits.filter(d => new Date(d.date).getFullYear() === currentSelectedYear);
            let labels = [], chartData = [];
            if (currentChartMode === 'monthly') {
                labels = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                chartData = new Array(12).fill(0);
                yearlyDeposits.forEach(d => { const m = new Date(d.date).getMonth(); if(m>=0 && m<12) chartData[m] += parseInt(d.crabs)||0; });
            } else if (currentChartMode === 'yearly') {
                const years = Array.from(new Set(db.deposits.map(d => new Date(d.date).getFullYear()))).filter(y=>!isNaN(y)).sort();
                labels = years.map(y => `ปี ${y+543}`);
                chartData = years.map(y => db.deposits.filter(d => new Date(d.date).getFullYear() === y).reduce((s, d) => s + (parseInt(d.crabs)||0), 0));
            } else {
                let dateMap = {};
                yearlyDeposits.forEach(d => { 
                    const dt = d.date.split('T')[0]; 
                    dateMap[dt] = (dateMap[dt]||0) + (parseInt(d.crabs)||0); 
                });
                labels = Object.keys(dateMap).sort().map(d => d.substring(5));
                chartData = Object.keys(dateMap).sort().map(d => dateMap[d]);
            }
            barChartInstance.data.labels = labels;
            barChartInstance.data.datasets = [{ data: chartData, backgroundColor: '#3b82f6', borderRadius: 4 }];
            barChartInstance.update();

            // Egg Donut
            let colorCounts = { 'เหลือง': 0, 'ส้ม': 0, 'ดำ': 0 };
            yearlyDeposits.forEach(d => { if(colorCounts[d.eggColor] !== undefined) colorCounts[d.eggColor] += parseInt(d.crabs)||0; });
            donutChartInstance.data.datasets = [{ data: [colorCounts['เหลือง'], colorCounts['ส้ม'], colorCounts['ดำ']], backgroundColor: ['#facc15', '#f97316', '#1f2937'] }];
            donutChartInstance.update();

            // Purchase Logic
            const yearlyPurchases = db.purchases.filter(p => new Date(p.date).getFullYear() === currentSelectedYear);
            let tM = 0, tL = 0, amtYr = 0, amtMo = 0, currMo = new Date().getMonth();
            yearlyPurchases.forEach(p => {
                tM += parseFloat(p.weightM)||0; tL += parseFloat(p.weightL)||0; 
                amtYr += parseFloat(p.totalAmt)||0;
                if(new Date(p.date).getMonth() === currMo) amtMo += parseFloat(p.totalAmt)||0;
            });
            
            document.getElementById('kpi-pur-year').innerText = '฿' + amtYr.toLocaleString();
            document.getElementById('kpi-pur-month').innerText = '฿' + amtMo.toLocaleString();
            purchaseDonutChartInstance.data.datasets = [{ data: [tM, tL], backgroundColor: ['#6366f1', '#a855f7'] }];
            purchaseDonutChartInstance.update();
        }

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function renderDeposit() {
            let options = db.members.map(m => `<option value="${m.id}">${m.id} - ${m.name}</option>`).join('');
            mainContent.innerHTML = `
                <div class="p-4 pb-10">
                    <form onsubmit="handleDepositSubmit(event)" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                        <h2 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-box-archive text-blue-500 mr-2"></i>รับฝากแม่ปู</h2>
                        
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">วันที่รับฝาก</label>
                            <input type="date" id="dep-date" value="${getToday()}" required class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none">
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">รหัสสมาชิก</label>
                            <select id="dep-member" required class="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 outline-none">
                                <option value="" disabled selected>เลือกสมาชิก...</option>${options}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">จำนวนแม่ปู (ตัว)</label>
                            <input type="number" id="dep-crabs" min="1" value="1" required class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none">
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">น้ำหนักรวม (กก.)</label>
                            <input type="number" id="dep-weight" step="0.1" required class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none">
                        </div>
                        <div class="mb-6">
                            <label class="block text-xs font-medium text-gray-600 mb-2">สีของไข่ปู</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label><input type="radio" name="dep-color" value="เหลือง" class="peer hidden" required>
                                    <div class="border p-2 rounded-xl text-center peer-checked:bg-yellow-100 peer-checked:border-yellow-400 text-xs">ไข่เหลือง</div>
                                </label>
                                <label><input type="radio" name="dep-color" value="ส้ม" class="peer hidden">
                                    <div class="border p-2 rounded-xl text-center peer-checked:bg-orange-100 peer-checked:border-orange-400 text-xs">ไข่ส้ม</div>
                                </label>
                                <label><input type="radio" name="dep-color" value="ดำ" class="peer hidden">
                                    <div class="border p-2 rounded-xl text-center peer-checked:bg-gray-200 peer-checked:border-gray-800 text-xs">ไข่ดำ</div>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg">บันทึกรับฝาก</button>
                    </form>
                </div>
            `;
        }

        function renderRelease() {
            let pending = db.deposits.filter(d => d.status === 'กำลังฟัก' || d.status === 'Pending');
            let options = pending.map(d => `<option value="${d.txnId}">${d.txnId} (${d.crabs} ตัว)</option>`).join('');
            if(pending.length === 0) options = `<option value="" disabled selected>ไม่มีรายการรอฟัก</option>`;

            mainContent.innerHTML = `
                <div class="p-4 pb-10">
                    <form onsubmit="handleReleaseSubmit(event)" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                        <h2 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-water text-green-500 mr-2"></i>ปล่อยลูกปู</h2>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">รหัสรับฝากอ้างอิง</label>
                            <select id="rel-txn" required class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none" onchange="autoFillRel()">${options}</select>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div><label class="block text-[10px] text-gray-500">จำนวนที่ฟัก</label><input type="number" id="rel-crabs" readonly class="w-full border p-2 bg-gray-100 text-sm"></div>
                            <div><label class="block text-[10px] text-gray-500">อัตราฟัก (%)</label><input type="number" id="rel-rate" value="80" max="100" class="w-full border p-2 text-sm"></div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">พิกัด</label>
                            <input type="text" id="rel-loc" value="12.345, 99.876" class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none">
                        </div>
                        <button type="submit" ${pending.length===0?'disabled':''} class="w-full bg-green-600 disabled:bg-gray-400 text-white font-bold py-3.5 rounded-xl">บันทึกปล่อยปู</button>
                    </form>
                </div>
            `;
        }
        
        function autoFillRel() {
            let t = document.getElementById('rel-txn').value;
            let d = db.deposits.find(x => x.txnId === t);
            if(d) document.getElementById('rel-crabs').value = d.crabs;
        }

        function renderPurchase() {
            let options = db.members.map(m => `<option value="${m.id}">${m.id} - ${m.name}</option>`).join('');
            mainContent.innerHTML = `
                <div class="p-4 pb-10">
                    <form onsubmit="handlePurchaseSubmit(event)" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                        <h2 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-hand-holding-dollar text-indigo-500 mr-2"></i>รับซื้อปูม้า</h2>
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-600 mb-1">รหัสผู้ขาย</label>
                            <select id="pur-member" required class="w-full border border-gray-300 rounded-lg p-3 text-sm">${options}</select>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div><label class="block text-[10px]">ไซส์ M (กก.)</label><input type="number" id="p-w-m" step="0.1" value="0" class="w-full border p-2 text-sm" oninput="calcPur()"></div>
                            <div><label class="block text-[10px]">ราคา (บ/กก.)</label><input type="number" id="p-p-m" value="250" class="w-full border p-2 text-sm" oninput="calcPur()"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div><label class="block text-[10px]">ไซส์ L (กก.)</label><input type="number" id="p-w-l" step="0.1" value="0" class="w-full border p-2 text-sm" oninput="calcPur()"></div>
                            <div><label class="block text-[10px]">ราคา (บ/กก.)</label><input type="number" id="p-p-l" value="350" class="w-full border p-2 text-sm" oninput="calcPur()"></div>
                        </div>
                        <div class="mb-4 bg-indigo-50 p-3 rounded-xl text-center">
                            <div class="text-xs text-indigo-700">รวมจ่าย</div>
                            <div class="text-2xl font-bold text-indigo-600">฿<span id="pur-tot">0</span></div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl">บันทึกรับซื้อ</button>
                    </form>
                </div>
            `;
        }

        function calcPur() {
            let m = (parseFloat(document.getElementById('p-w-m').value)||0) * (parseFloat(document.getElementById('p-p-m').value)||0);
            let l = (parseFloat(document.getElementById('p-w-l').value)||0) * (parseFloat(document.getElementById('p-p-l').value)||0);
            document.getElementById('pur-tot').innerText = (m+l).toLocaleString();
        }

        function renderMembers() {
            let html = db.members.map(m => `
                <div class="bg-white rounded-xl shadow-sm border p-3 mb-2 flex justify-between">
                    <div><div class="font-bold text-sm">${m.name}</div><div class="text-[10px] text-gray-500">${m.id} | ${m.area}</div></div>
                    <div class="text-right text-orange-500 font-bold">${m.points} pt</div>
                </div>
            `).join('');
            
            // Check Role
            let btnHtml = '';
            if (currentRole === 'admin') {
                btnHtml = `<button onclick="document.getElementById('modal-add-member').classList.remove('hidden')" class="w-full bg-white border-2 border-dashed border-blue-300 text-blue-600 font-bold py-3 rounded-xl mt-4"><i class="fa-solid fa-user-plus mr-2"></i> ลงทะเบียนสมาชิกใหม่</button>`;
            } else {
                btnHtml = `<div class="text-center text-xs text-gray-400 mt-4">เฉพาะ Admin เท่านั้นที่สามารถเพิ่มสมาชิกได้</div>`;
            }

            mainContent.innerHTML = `<div class="p-4 pb-10"><h2 class="text-base font-bold mb-4">สมาชิกชาวประมง (${db.members.length}/300)</h2>${html}${btnHtml}</div>`;
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // ==========================================
        // 4. DATA SUBMISSION LOGIC (Send to GAS)
        // ==========================================
        
        function handleAddMember(e) {
            e.preventDefault();
            if (db.members.length >= MAX_MEMBERS) { showToast('สมาชิกเต็ม 300 คนแล้ว'); return; }
            const id = 'F' + (db.members.length + 1).toString().padStart(3, '0');
            const row = [
                id, 
                document.getElementById('new-member-name').value,
                document.getElementById('new-member-phone').value,
                document.getElementById('new-member-area').value,
                0 // Points
            ];
            closeModal('modal-add-member');
            pushDataToSheet('Member_Registry', row, `Added member ${id}`, 'เพิ่มสมาชิกสำเร็จ');
        }

        function handleDepositSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('dep-date').value;
            const txn = 'TXN-' + Date.now().toString().slice(-6);
            const color = document.querySelector('input[name="dep-color"]:checked').value;
            let hDate = new Date(date); hDate.setDate(hDate.getDate() + (color==='ดำ'?2:color==='ส้ม'?5:10));
            
            const row = [
                txn,
                date,
                document.getElementById('dep-member').value,
                document.getElementById('dep-crabs').value,
                document.getElementById('dep-weight').value,
                color,
                hDate.toISOString().split('T')[0],
                'กำลังฟัก'
            ];
            pushDataToSheet('Deposit_Log', row, `Deposit ${txn}`, 'บันทึกการรับฝากสำเร็จ');
        }

        function handleReleaseSubmit(e) {
            e.preventDefault();
            const txn = document.getElementById('rel-txn').value;
            const crabs = document.getElementById('rel-crabs').value;
            const rate = document.getElementById('rel-rate').value;
            const zoea = Math.floor(crabs * 500000 * (rate / 100));
            
            const row = [
                getToday(), txn, crabs, rate, zoea, document.getElementById('rel-loc').value
            ];
            pushDataToSheet('Release_Log', row, `Release for ${txn}`, 'บันทึกการปล่อยสำเร็จ');
        }

        function handlePurchaseSubmit(e) {
            e.preventDefault();
            const txn = 'PUR-' + Date.now().toString().slice(-6);
            const wm = parseFloat(document.getElementById('p-w-m').value)||0;
            const pm = parseFloat(document.getElementById('p-p-m').value)||0;
            const wl = parseFloat(document.getElementById('p-w-l').value)||0;
            const pl = parseFloat(document.getElementById('p-p-l').value)||0;
            const tot = (wm*pm) + (wl*pl);
            
            if(tot <= 0) { showToast('กรุณาระบุข้อมูลการรับซื้อ'); return; }
            
            const row = [
                txn, getToday(), document.getElementById('pur-member').value, wm, pm, wl, pl, tot
            ];
            pushDataToSheet('Purchase_Log', row, `Purchase ${txn}`, 'บันทึกการรับซื้อสำเร็จ');
        }

        // Mock Data for offline testing
        function getMockData() {
            return {
                members: [{ id: 'F001', name: 'สมชาย รักษ์ทะเล', phone: '0811111111', area: 'สะพลี', points: 50 }],
                deposits: [{ txnId: 'TXN-0001', date: '2026-10-01', memberId: 'F001', crabs: 15, weight: 3.2, eggColor: 'เหลือง', estHatchDate: '2026-10-11', status: 'กำลังฟัก' }],
                releases: [],
                purchases: [{ txnId: 'PUR-0001', date: '2026-10-02', memberId: 'F001', weightM: 2.5, priceM: 250, weightL: 1.0, priceL: 350, totalAmt: 975 }]
            };
        }
    </script>
