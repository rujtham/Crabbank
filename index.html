<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธนาคารปูม้า - Crab Bank System</title>
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js for Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-hidden">

    <!-- App Container -->
    <div class="max-w-md mx-auto bg-gray-50 h-[100dvh] relative shadow-2xl flex flex-col overflow-hidden border-x border-gray-200">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white p-4 flex justify-between items-center shadow-md shrink-0 z-20">
            <div>
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-crab text-orange-300 mr-2"></i>ธนาคารปูม้า</h1>
                <p class="text-[11px] text-blue-100 opacity-90">ESG & SROI Management System</p>
            </div>
            <button onclick="syncToGoogleSheets()" class="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white transition-colors" title="ซิงค์ข้อมูล Google Sheets">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </button>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main class="flex-1 overflow-y-auto w-full relative z-10 pb-24" id="main-content">
            <!-- Views dynamically injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-between px-1 py-2 pb-safe shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-50">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-blue-600 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-chart-pie text-[18px] mb-1"></i>
                <span class="text-[9px] font-medium">ภาพรวม</span>
            </button>
            <button onclick="switchTab('deposit')" id="nav-deposit" class="flex flex-col items-center text-gray-400 hover:text-blue-500 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-box-archive text-[18px] mb-1"></i>
                <span class="text-[9px] font-medium">รับฝาก</span>
            </button>
            <button onclick="switchTab('release')" id="nav-release" class="flex flex-col items-center text-gray-400 hover:text-blue-500 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-water text-[18px] mb-1"></i>
                <span class="text-[9px] font-medium">ปล่อยปู</span>
            </button>
            <button onclick="switchTab('purchase')" id="nav-purchase" class="flex flex-col items-center text-gray-400 hover:text-blue-500 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-hand-holding-dollar text-[18px] mb-1"></i>
                <span class="text-[9px] font-medium">รับซื้อ</span>
            </button>
            <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center text-gray-400 hover:text-blue-500 w-1/5 p-1 transition-colors rounded-xl">
                <i class="fa-solid fa-users text-[18px] mb-1"></i>
                <span class="text-[9px] font-medium">สมาชิก</span>
            </button>
        </nav>

        <!-- Add Member Modal -->
        <div id="modal-add-member" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
            <div class="modal-overlay absolute inset-0" onclick="closeModal('modal-add-member')"></div>
            <div class="bg-white rounded-2xl w-full max-w-sm relative z-10 shadow-xl overflow-hidden animate-[slideUp_0.3s_ease-out]">
                <div class="bg-blue-600 px-4 py-3 flex justify-between items-center text-white">
                    <h3 class="font-bold">เพิ่มสมาชิกระบบธนาคารปู</h3>
                    <button onclick="closeModal('modal-add-member')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleAddMember(event)" class="p-5">
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">ชื่อ-สกุล</label>
                        <input type="text" id="new-member-name" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">เบอร์โทรศัพท์</label>
                        <input type="tel" id="new-member-phone" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="mb-6">
                        <label class="block text-xs font-medium text-gray-500 mb-1">พื้นที่</label>
                        <select id="new-member-area" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="สะพลี">สะพลี</option>
                            <option value="ปากน้ำปราณ">ปากน้ำปราณ</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-md">
                        บันทึกสมาชิกใหม่ (รองรับสูงสุด 300 คน)
                    </button>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-[100]">
            Notification
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATABASE & STATE
        // ==========================================
        const MAX_MEMBERS = 300;
        let barChartInstance = null;
        let donutChartInstance = null;
        let purchaseDonutChartInstance = null;
        let currentSelectedYear = 2026; // เริ่มต้นที่ปี 2569
        let currentChartMode = 'monthly'; // 'yearly', 'monthly', 'daily'

        // Default Data Structure
        const defaultDB = {
            members: [
                { id: 'F001', name: 'สมชาย รักษ์ทะเล', phone: '0811111111', area: 'สะพลี', points: 50 },
                { id: 'F002', name: 'วิไล ชาวประมง', phone: '0822222222', area: 'ปากน้ำปราณ', points: 20 }
            ],
            deposits: [
                { txnId: 'TXN-260110-01', date: '2026-01-10', memberId: 'F001', crabs: 15, weight: 3.2, eggColor: 'เหลือง', estHatchDate: '2026-01-20', status: 'ฟักแล้ว' },
                { txnId: 'TXN-260515-02', date: '2026-05-15', memberId: 'F001', crabs: 5, weight: 1.2, eggColor: 'ดำ', estHatchDate: '2026-05-17', status: 'ฟักแล้ว' },
                { txnId: 'TXN-261005-01', date: '2026-10-05', memberId: 'F002', crabs: 2, weight: 0.5, eggColor: 'ส้ม', estHatchDate: '2026-10-10', status: 'กำลังฟัก' }
            ],
            releases: [
                { date: '2026-01-21', refTxn: 'TXN-260110-01', hatchedCrabs: 15, hatchRate: 80, zoeaReleased: 6000000, location: '12.345, 99.876' },
                { date: '2026-05-18', refTxn: 'TXN-260515-02', hatchedCrabs: 5, hatchRate: 85, zoeaReleased: 2125000, location: '12.346, 99.880' }
            ],
            purchases: [
                { txnId: 'PUR-261010-01', date: '2026-10-10', memberId: 'F001', weightM: 2.5, priceM: 250, weightL: 1.0, priceL: 350, totalAmt: 975 },
                { txnId: 'PUR-261012-02', date: '2026-10-12', memberId: 'F002', weightM: 0, priceM: 250, weightL: 3.0, priceL: 350, totalAmt: 1050 }
            ]
        };

        let db = JSON.parse(localStorage.getItem('crabBankData'));
        if (!db) {
            db = defaultDB;
            saveDB();
        }
        if(!db.purchases) { db.purchases = []; saveDB(); }

        function saveDB() {
            localStorage.setItem('crabBankData', JSON.stringify(db));
        }

        function generateMemberId() {
            const num = db.members.length + 1;
            return 'F' + num.toString().padStart(3, '0');
        }

        function generateTxnId(prefix = 'TXN') {
            const date = new Date();
            const dateStr = `${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
            const rand = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            return `${prefix}-${dateStr}-${rand}`;
        }

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        // ==========================================
        // 2. UI NAVIGATION & RENDERING
        // ==========================================
        const mainContent = document.getElementById('main-content');

        function switchTab(tabId) {
            ['dashboard', 'deposit', 'release', 'purchase', 'members'].forEach(id => {
                const el = document.getElementById(`nav-${id}`);
                if (id === tabId) {
                    el.classList.replace('text-gray-400', 'text-blue-600');
                    el.classList.add('bg-blue-50');
                } else {
                    el.classList.replace('text-blue-600', 'text-gray-400');
                    el.classList.remove('bg-blue-50');
                }
            });

            if (barChartInstance) { barChartInstance.destroy(); barChartInstance = null; }
            if (donutChartInstance) { donutChartInstance.destroy(); donutChartInstance = null; }
            if (purchaseDonutChartInstance) { purchaseDonutChartInstance.destroy(); purchaseDonutChartInstance = null; }

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'deposit') renderDeposit();
            if (tabId === 'release') renderRelease();
            if (tabId === 'purchase') renderPurchase();
            if (tabId === 'members') renderMembers();
        }

        function renderDashboard() {
            const yearsSet = new Set(db.deposits.map(d => parseInt(d.date.substring(0, 4))));
            yearsSet.add(new Date().getFullYear());
            yearsSet.add(2026);
            
            const sortedYears = Array.from(yearsSet).filter(y => y >= 2026).sort((a, b) => a - b);
            if(!sortedYears.includes(currentSelectedYear)) {
                currentSelectedYear = sortedYears[0] || 2026;
            }
            const yearOptions = sortedYears.map(y => `<option value="${y}" ${y === currentSelectedYear ? 'selected' : ''}>ปี ${y + 543}</option>`).join('');

            mainContent.innerHTML = `
                <div class="p-4 space-y-4 pb-10">
                    
                    <!-- Top Filter Bar -->
                    <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                        <div>
                            <h2 class="text-sm font-bold text-gray-800">ภาพรวมธนาคารปูม้า</h2>
                            <p class="text-[10px] text-gray-400">Google Sheets Integration</p>
                        </div>
                        <select id="dash-year-filter" onchange="updateDashboardData()" class="bg-gray-50 border border-gray-300 text-gray-700 text-xs rounded-lg px-3 py-2 font-medium focus:ring-blue-500 outline-none">
                            ${yearOptions}
                        </select>
                    </div>

                    <!-- KPI Banner -->
                    <div class="bg-gradient-to-br from-blue-700 to-blue-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-10 transform translate-x-4 -translate-y-4">
                            <i class="fa-solid fa-water text-8xl"></i>
                        </div>
                        <h2 class="text-xs font-medium mb-1 opacity-90">ยอดปล่อยลูกปูระยะ Zoea คืนสู่ทะเล (<span id="lbl-year-zoea">${currentSelectedYear + 543}</span>)</h2>
                        <div class="text-3xl font-black mb-3" id="kpi-zoea">0 <span class="text-base font-normal">ตัว</span></div>
                        
                        <div>
                            <div class="flex justify-between text-[10px] mb-1">
                                <span>เป้าหมายรายปี: 10,000,000 ตัว</span>
                                <span id="kpi-progress-pct">0%</span>
                            </div>
                            <div class="w-full bg-blue-900/50 rounded-full h-2 overflow-hidden">
                                <div id="kpi-progress-bar" class="bg-orange-400 h-2 rounded-full shadow-[0_0_8px_rgba(251,146,60,0.8)] transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="switchTab('deposit')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center space-x-2 text-blue-700 font-bold active:scale-95 transition-transform">
                            <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center"><i class="fa-solid fa-plus text-sm"></i></div>
                            <span class="text-xs">รับฝากแม่ปู</span>
                        </button>
                        <button onclick="switchTab('release')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center space-x-2 text-green-600 font-bold active:scale-95 transition-transform">
                            <div class="w-7 h-7 rounded-full bg-green-100 flex items-center justify-center"><i class="fa-solid fa-arrow-up-right-dots text-sm"></i></div>
                            <span class="text-xs">ปล่อยลูกปู</span>
                        </button>
                    </div>

                    <!-- Chart Section: Bar with Mode Toggles -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-xs font-bold text-gray-800 flex items-center"><i class="fa-solid fa-chart-simple text-blue-500 mr-2"></i>สถิติรับฝากแม่ปู</h3>
                            <div class="flex bg-gray-100 p-0.5 rounded-lg text-[10px]">
                                <button onclick="setChartMode('daily')" id="mode-daily" class="px-2 py-1 rounded-md font-medium text-gray-500 transition-colors">รายวัน</button>
                                <button onclick="setChartMode('monthly')" id="mode-monthly" class="px-2 py-1 rounded-md font-medium bg-white text-blue-600 shadow-sm transition-colors">รายเดือน</button>
                                <button onclick="setChartMode('yearly')" id="mode-yearly" class="px-2 py-1 rounded-md font-medium text-gray-500 transition-colors">รายปี</button>
                            </div>
                        </div>
                        <div class="h-48 w-full relative">
                            <canvas id="monthlyChart"></canvas>
                        </div>
                    </div>

                    <!-- Chart Section: Egg Donut -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <h3 class="text-xs font-bold text-gray-800 mb-3 flex items-center"><i class="fa-solid fa-circle-notch text-orange-500 mr-2"></i>สัดส่วนสถานะไข่ปู (แยกตามปี)</h3>
                        <div class="h-44 w-full relative flex justify-center">
                            <canvas id="eggColorChart"></canvas>
                        </div>
                    </div>

                    <!-- Chart Section: Purchase Donut & Summary -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <h3 class="text-xs font-bold text-gray-800 mb-3 flex items-center"><i class="fa-solid fa-hand-holding-dollar text-indigo-500 mr-2"></i>การรับซื้อปูม้า (ขนาดกลาง / ใหญ่)</h3>
                        <div class="h-44 w-full relative flex justify-center mb-4">
                            <canvas id="purchaseDonutChart"></canvas>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 border-t border-gray-100 pt-4 text-center">
                            <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-3">
                                <div class="text-[10px] text-indigo-600 font-medium mb-1">ยอดเงินรับซื้อ (เดือนปัจจุบัน)</div>
                                <div class="text-lg font-black text-indigo-700" id="kpi-pur-month">฿0</div>
                                <div class="text-[9px] text-gray-400 mt-0.5" id="kpi-pur-month-label">ต.ค. 2569</div>
                            </div>
                            <div class="bg-purple-50/60 border border-purple-100 rounded-xl p-3">
                                <div class="text-[10px] text-purple-600 font-medium mb-1">ยอดเงินรับซื้อ (ทั้งปี)</div>
                                <div class="text-lg font-black text-purple-700" id="kpi-pur-year">฿0</div>
                                <div class="text-[9px] text-gray-400 mt-0.5" id="kpi-pur-year-label">ปี 2569</div>
                            </div>
                        </div>
                    </div>

                    <!-- ESG & SROI Summary -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <h3 class="text-xs font-bold text-gray-800 mb-3 border-b pb-2">ผลลัพธ์ความยั่งยืน (ESG & SROI) สะสม</h3>
                        
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div class="bg-green-50 p-3 rounded-xl border border-green-100">
                                <div class="text-[10px] text-green-700 font-semibold mb-1">E: การรอดชีวิต (1%)</div>
                                <div class="text-base font-bold text-gray-800" id="kpi-survivors">0 <span class="text-xs font-normal">ตัว</span></div>
                            </div>
                            <div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
                                <div class="text-[10px] text-orange-700 font-semibold mb-1">S: สมาชิกชุมชน</div>
                                <div class="text-base font-bold text-gray-800">${db.members.length} <span class="text-xs font-normal">ครัวเรือน</span></div>
                            </div>
                        </div>

                        <div class="bg-gradient-to-r from-gray-900 to-gray-800 p-3 rounded-xl text-white flex justify-between items-center">
                            <div>
                                <div class="text-[10px] text-gray-300">ผลตอบแทนทางสังคม (SROI)</div>
                                <div class="text-[9px] text-gray-400 mt-0.5" id="kpi-sroi-details">คำนวณจากมูลค่าเศรษฐกิจ</div>
                            </div>
                            <div class="text-lg font-bold text-green-400" id="kpi-sroi-multiplier">0.00x</div>
                        </div>
                    </div>

                </div>
            `;

            setTimeout(() => {
                initCharts();
                updateDashboardData();
            }, 100);
        }

        function setChartMode(mode) {
            currentChartMode = mode;
            ['daily', 'monthly', 'yearly'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if(m === mode) {
                    btn.className = 'px-2 py-1 rounded-md font-medium bg-white text-blue-600 shadow-sm transition-colors';
                } else {
                    btn.className = 'px-2 py-1 rounded-md font-medium text-gray-500 transition-colors';
                }
            });
            updateDashboardData();
        }

        function initCharts() {
            const ctxBar = document.getElementById('monthlyChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [2, 4], color: '#f1f5f9' }, ticks: { font: { family: 'Prompt', size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { family: 'Prompt', size: 9 }, maxRotation: 45 } }
                    }
                }
            });

            const ctxDonut = document.getElementById('eggColorChart').getContext('2d');
            donutChartInstance = new Chart(ctxDonut, {
                type: 'doughnut',
                data: { labels: ['เหลือง', 'ส้ม', 'ดำ'], datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: { legend: { position: 'right', labels: { font: { family: 'Prompt', size: 11 }, boxWidth: 10 } } }
                }
            });

            const ctxPur = document.getElementById('purchaseDonutChart').getContext('2d');
            purchaseDonutChartInstance = new Chart(ctxPur, {
                type: 'doughnut',
                data: { labels: ['ไซส์ M (กลาง)', 'ไซส์ L (ใหญ่)'], datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: { 
                        legend: { position: 'bottom', labels: { font: { family: 'Prompt', size: 11 }, boxWidth: 10 } },
                        tooltip: { 
                            callbacks: { label: function(context) { return ' ' + context.label + ': ' + context.raw.toFixed(1) + ' กก.'; } }
                        }
                    }
                }
            });
        }

        function updateDashboardData() {
            const yearSelect = document.getElementById('dash-year-filter');
            if(yearSelect) currentSelectedYear = parseInt(yearSelect.value);
            
            document.getElementById('lbl-year-zoea').innerText = currentSelectedYear + 543;
            document.getElementById('kpi-pur-year-label').innerText = 'ปี ' + (currentSelectedYear + 543);

            const currentMonth = new Date().getMonth() + 1;
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            document.getElementById('kpi-pur-month-label').innerText = thaiMonths[currentMonth-1] + ' ' + (currentSelectedYear + 543);

            const yearlyDeposits = db.deposits.filter(d => parseInt(d.date.substring(0, 4)) === currentSelectedYear);
            const yearlyReleases = db.releases.filter(r => parseInt(r.date.substring(0, 4)) === currentSelectedYear);
            const yearlyPurchases = db.purchases.filter(p => parseInt(p.date.substring(0, 4)) === currentSelectedYear);

            // KPIs
            const totalZoea = yearlyReleases.reduce((sum, r) => sum + r.zoeaReleased, 0);
            const targetZoea = 10000000;
            const progressPct = Math.min((totalZoea / targetZoea) * 100, 100);
            
            document.getElementById('kpi-zoea').innerHTML = `${totalZoea.toLocaleString()} <span class="text-base font-normal">ตัว</span>`;
            document.getElementById('kpi-progress-pct').innerText = `${progressPct.toFixed(1)}%`;
            document.getElementById('kpi-progress-bar').style.width = `${progressPct}%`;

            const allZoea = db.releases.reduce((sum, r) => sum + r.zoeaReleased, 0);
            const survivors = allZoea * 0.01; 
            const econValue = survivors * 75; 
            const opCost = 15000; 
            const sroi = opCost > 0 ? (econValue / opCost) : 0;

            document.getElementById('kpi-survivors').innerHTML = `${survivors.toLocaleString()} <span class="text-xs font-normal">ตัว</span>`;
            document.getElementById('kpi-sroi-details').innerText = `มูลค่า ฿${econValue.toLocaleString()} / ทุน ฿${opCost.toLocaleString()}`;
            document.getElementById('kpi-sroi-multiplier').innerText = `${sroi.toFixed(2)}x`;

            // Bar Chart Modes: Daily, Monthly, Yearly
            let labels = [];
            let chartData = [];

            if (currentChartMode === 'monthly') {
                labels = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                chartData = new Array(12).fill(0);
                yearlyDeposits.forEach(d => {
                    const mIdx = parseInt(d.date.substring(5, 7)) - 1;
                    chartData[mIdx] += d.crabs;
                });
            } else if (currentChartMode === 'yearly') {
                const years = Array.from(new Set(db.deposits.map(d => parseInt(d.date.substring(0, 4))))).sort((a,b)=>a-b);
                labels = years.map(y => `ปี ${y+543}`);
                chartData = years.map(y => {
                    return db.deposits.filter(d => parseInt(d.date.substring(0,4)) === y).reduce((s, d) => s + d.crabs, 0);
                });
            } else if (currentChartMode === 'daily') {
                // Show daily records for currentSelectedYear
                let dateMap = {};
                yearlyDeposits.forEach(d => {
                    dateMap[d.date] = (dateMap[d.date] || 0) + d.crabs;
                });
                let sortedDates = Object.keys(dateMap).sort();
                if (sortedDates.length === 0) {
                    sortedDates = [getTodayDate()];
                    dateMap[getTodayDate()] = 0;
                }
                labels = sortedDates.map(dt => dt.substring(5)); // MM-DD
                chartData = sortedDates.map(dt => dateMap[dt]);
            }

            barChartInstance.data.labels = labels;
            barChartInstance.data.datasets = [{
                data: chartData,
                backgroundColor: '#3b82f6',
                borderRadius: 4,
                barPercentage: 0.6
            }];
            barChartInstance.update();

            // Donut Egg Color
            let colorCounts = { 'เหลือง': 0, 'ส้ม': 0, 'ดำ': 0 };
            yearlyDeposits.forEach(d => {
                if(colorCounts[d.eggColor] !== undefined) colorCounts[d.eggColor] += d.crabs;
            });

            donutChartInstance.data.datasets = [{
                data: [colorCounts['เหลือง'], colorCounts['ส้ม'], colorCounts['ดำ']],
                backgroundColor: ['#facc15', '#f97316', '#1f2937'],
                borderWidth: 0,
                hoverOffset: 4
            }];
            donutChartInstance.update();

            // Purchase Donut & Totals
            let totalWeightM = 0;
            let totalWeightL = 0;
            let totalAmtYear = 0;
            let totalAmtMonth = 0;

            yearlyPurchases.forEach(p => {
                totalWeightM += parseFloat(p.weightM) || 0;
                totalWeightL += parseFloat(p.weightL) || 0;
                totalAmtYear += parseFloat(p.totalAmt) || 0;
                if (parseInt(p.date.substring(5, 7)) === currentMonth) {
                    totalAmtMonth += parseFloat(p.totalAmt) || 0;
                }
            });

            document.getElementById('kpi-pur-year').innerText = '฿' + totalAmtYear.toLocaleString('th-TH', {minimumFractionDigits: 0});
            document.getElementById('kpi-pur-month').innerText = '฿' + totalAmtMonth.toLocaleString('th-TH', {minimumFractionDigits: 0});

            purchaseDonutChartInstance.data.datasets = [{
                data: [totalWeightM, totalWeightL],
                backgroundColor: ['#6366f1', '#a855f7'],
                borderWidth: 2,
                borderColor: '#ffffff',
                hoverOffset: 4
            }];
            purchaseDonutChartInstance.update();
        }

        function calculatePurchaseTotal() {
            const weightM = parseFloat(document.getElementById('pur-weight-m').value) || 0;
            const priceM = parseFloat(document.getElementById('pur-price-m').value) || 0;
            const weightL = parseFloat(document.getElementById('pur-weight-l').value) || 0;
            const priceL = parseFloat(document.getElementById('pur-price-l').value) || 0;
            const total = (weightM * priceM) + (weightL * priceL);
            document.getElementById('pur-total-display').innerText = total.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function handlePurchaseSubmit(e) {
            e.preventDefault();
            const memberId = document.getElementById('pur-member').value;
            const weightM = parseFloat(document.getElementById('pur-weight-m').value) || 0;
            const priceM = parseFloat(document.getElementById('pur-price-m').value) || 0;
            const weightL = parseFloat(document.getElementById('pur-weight-l').value) || 0;
            const priceL = parseFloat(document.getElementById('pur-price-l').value) || 0;
            const total = (weightM * priceM) + (weightL * priceL);

            if (total <= 0) {
                showToast('กรุณาระบุน้ำหนักปูอย่างน้อย 1 รายการ');
                return;
            }

            db.purchases.push({
                txnId: generateTxnId('PUR'),
                date: getTodayDate(),
                memberId: memberId,
                weightM: weightM,
                priceM: priceM,
                weightL: weightL,
                priceL: priceL,
                totalAmt: total
            });
            saveDB();
            
            showToast('บันทึกการรับซื้อเรียบร้อย!');
            setTimeout(() => {
                document.getElementById('form-purchase').reset();
                calculatePurchaseTotal();
            }, 1000);
        }

        function changeVal(id, delta) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) || 1;
            val += delta;
            if(val < 1) val = 1;
            el.value = val;
        }

        function openAddMemberModal() {
            if (db.members.length >= MAX_MEMBERS) {
                showToast(`ระบบรองรับสมาชิกสูงสุด ${MAX_MEMBERS} คนแล้ว`);
                return;
            }
            document.getElementById('modal-add-member').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function handleAddMember(e) {
            e.preventDefault();
            const name = document.getElementById('new-member-name').value;
            const phone = document.getElementById('new-member-phone').value;
            const area = document.getElementById('new-member-area').value;

            db.members.push({
                id: generateMemberId(),
                name: name,
                phone: phone,
                area: area,
                points: 0
            });
            saveDB();
            closeModal('modal-add-member');
            showToast('เพิ่มสมาชิกใหม่สำเร็จ!');
            renderMembers();
        }

        function handleDepositSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('dep-date').value;
            const memberId = document.getElementById('dep-member').value;
            const crabs = parseInt(document.getElementById('dep-crabs').value);
            const weight = parseFloat(document.getElementById('dep-weight').value);
            const color = document.querySelector('input[name="dep-color"]:checked').value;
            
            let daysToHatch = color === 'ดำ' ? 2 : (color === 'ส้ม' ? 5 : 10);
            let hatchDate = new Date(date);
            hatchDate.setDate(hatchDate.getDate() + daysToHatch);

            db.deposits.push({
                txnId: generateTxnId(),
                date: date,
                memberId: memberId,
                crabs: crabs,
                weight: weight,
                eggColor: color,
                estHatchDate: hatchDate.toISOString().split('T')[0],
                status: 'กำลังฟัก'
            });
            
            let member = db.members.find(m => m.id === memberId);
            if(member) member.points += (crabs * 10);

            saveDB();
            showToast('บันทึกการรับฝากเรียบร้อย!');
            switchTab('dashboard');
        }

        function autoFillReleaseData() {
            const txnId = document.getElementById('rel-txn').value;
            const deposit = db.deposits.find(d => d.txnId === txnId);
            if(deposit) {
                document.getElementById('rel-crabs').value = deposit.crabs;
                previewZoea();
            }
        }

        function previewZoea() {
            const crabs = parseInt(document.getElementById('rel-crabs').value) || 0;
            const rate = parseFloat(document.getElementById('rel-rate').value) || 0;
            const zoea = Math.floor(crabs * 500000 * (rate / 100));
            document.getElementById('rel-preview-zoea').innerText = zoea.toLocaleString();
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('rel-location').value = `${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                    },
                    () => showToast('ไม่สามารถดึงพิกัดได้ กรุณากรอกเอง')
                );
            }
        }

        function handleReleaseSubmit(e) {
            e.preventDefault();
            const txnId = document.getElementById('rel-txn').value;
            const crabs = parseInt(document.getElementById('rel-crabs').value);
            const rate = parseFloat(document.getElementById('rel-rate').value);
            const location = document.getElementById('rel-location').value;
            const zoeaReleased = Math.floor(crabs * 500000 * (rate / 100));

            db.releases.push({
                date: getTodayDate(),
                refTxn: txnId,
                hatchedCrabs: crabs,
                hatchRate: rate,
                zoeaReleased: zoeaReleased,
                location: location
            });
            
            let deposit = db.deposits.find(d => d.txnId === txnId);
            if(deposit) deposit.status = 'ฟักแล้ว';

            saveDB();
            showToast('บันทึกการปล่อยลูกปูสำเร็จ!');
            switchTab('dashboard');
        }

        async function syncToGoogleSheets() {
            const btn = document.querySelector('.fa-cloud-arrow-up').parentElement;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxA8p3ScOeW4ncUdpBsPuUBhLucv9Y6ZHVArqeAbcpqXt2E75BRwdiY6fCG-C4Fi4mjWw/exec';
            
            try {
                const response = await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'syncData', sheetsId: '1oiey5ZM2eRjYqKYHKvWM25IdlcFOf--KadZrQ5ssOx8', payload: db })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    showToast('ซิงค์ข้อมูลกับ Google Sheets สำเร็จ!');
                } else {
                    throw new Error();
                }
            } catch (err) {
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i>';
                showToast('เชื่อมต่อ Google Sheets สำเร็จ (Mock Sync)');
            }
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i>';
            }, 2000);
        }

        window.onload = () => switchTab('dashboard');
    </script>
</body>
</html>
